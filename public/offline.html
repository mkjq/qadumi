<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لا يوجد اتصال بالإنترنت - مركز القدومي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            width: 400px;
        }
        svg {
            width: 80px;
            height: 80px;
            color: #9ca3af;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #111827;
        }
        p {
            font-size: 16px;
            color: #4b5563;
            margin-bottom: 30px;
        }
        button {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0284c7;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Wi-Fi Off Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18m-2.903-2.903A9.956 9.956 0 0112 21c-2.484 0-4.75-.904-6.5-2.4M5.636 5.636a9.96 9.96 0 013.918-2.22m3.655-.138c2.42.348 4.606 1.488 6.155 3.167" />
        </svg>
        <h1>أنت غير متصل بالإنترنت</h1>
        <p>يرجى التحقق من اتصالك بشبكة Wi-Fi أو بيانات الهاتف والمحاولة مرة أخرى.</p>
        <button onclick="window.location.reload()">إعادة المحاولة</button>
    </div>
</body>
</html>
